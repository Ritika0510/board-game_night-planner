version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: boardnight-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boardnight_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  api:
    build: .
    container_name: boardnight-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: boardnight_db
      JWT_SECRET: super_secret_jwt_key
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      - db

volumes:
  pgdata: